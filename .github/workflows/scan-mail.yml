name: Scan mail on Fly

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Fly.io region code (leave blank to use default)"
        required: false
        default: ""
      timeout_secs:
        description: "Max seconds to let the job run"
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: scan-mail
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: grad-app
      DEFAULT_REGION: sin
      TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs || '900' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Show flyctl version
        run: flyctl version

      - name: Pick region (manual input wins)
        id: pick-region
        run: |
          REGION_INPUT="${{ github.event.inputs.region }}"
          if [ -n "$REGION_INPUT" ]; then
            echo "REGION=$REGION_INPUT" >> $GITHUB_OUTPUT
          else
            echo "REGION=$DEFAULT_REGION" >> $GITHUB_OUTPUT
          fi
          echo "Using region: $(grep REGION $GITHUB_OUTPUT | cut -d'=' -f2)"

      - name: Run one-off scan on Fly Machine
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting one-off job on app '$FLY_APP' in region '${{ steps.pick-region.outputs.REGION }}'..."
          timeout "${TIMEOUT_SECS}s" \
          flyctl m run \
            registry.fly.io/$FLY_APP:current \
            --app "$FLY_APP" \
            --region "${{ steps.pick-region.outputs.REGION }}" \
            --restart no \
            --rm \
            --entrypoint python \
            manage.py scan_mail

          echo "Scan finished."