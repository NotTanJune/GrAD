name: Scan mail on Fly

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Fly.io region code (leave blank to use default)"
        required: false
        default: ""
      timeout_secs:
        description: "Max seconds to let the job run"
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: scan-mail
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: grad-app
      DEFAULT_REGION: sin
      TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs || '900' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure jq is available
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine region
        id: pick-region
        run: |
          REGION_INPUT="${{ github.event.inputs.region }}"
          if [ -n "$REGION_INPUT" ]; then
            echo "REGION=$REGION_INPUT" >> $GITHUB_OUTPUT
          else
            echo "REGION=$DEFAULT_REGION" >> $GITHUB_OUTPUT
          fi

      - name: Resolve currently deployed image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          APP="$FLY_APP"

          IMG="$(flyctl m list --app "$APP" --json | jq -r '.[0].config.image // empty')"

          if [ -z "$IMG" ] || [ "$IMG" = "null" ]; then
            IMG="$(flyctl releases --app "$APP" --json | jq -r '.[0].image_ref // empty')"
          fi

          if [ -z "$IMG" ] || [ "$IMG" = "null" ]; then
            echo "Could not resolve current image for app $APP" >&2
            exit 1
          fi

          echo "image=$IMG" >> $GITHUB_OUTPUT
          echo "Using image: $IMG"

      - name: Run one-off scan on Fly Machine
        shell: bash
        run: |
          set -euo pipefail

          APP="$FLY_APP"
          REGION="${{ steps.pick-region.outputs.REGION }}"
          IMG="${{ steps.image.outputs.image }}"
          echo "Starting one-off job on app '$APP' in region '$REGION' with image '$IMG'..."

          if timeout "${TIMEOUT_SECS}s" \
            flyctl m run "$IMG" \
              --app "$APP" \
              --region "$REGION" \
              --restart no \
              --rm \
              python manage.py scan_mail; then
            echo "Scan finished (direct command)."
            exit 0
          fi

          echo "Direct command failed; retrying with overridden entrypoint..."

          timeout "${TIMEOUT_SECS}s" \
          flyctl m run "$IMG" \
            --app "$APP" \
            --region "$REGION" \
            --restart no \
            --rm \
            --entrypoint python \
            manage.py scan_mail

          echo "Scan finished (entrypoint fallback)."
